# emu-amd64-desktop.conf - AMD64/x86-64 Desktop Configuration
# Balanced configuration for desktop and workstation workloads
#
# Suitable for:
# - Desktop virtualization
# - Software development
# - Lightweight application hosting
# - Gaming (with GPU pass-through)
# - General productivity
#
# Installation: Copy to /usr/local/etc/emu/emu.conf

# ============================================================================
# ARCHITECTURE SETTINGS
# ============================================================================

# Target architecture
arch=amd64

# CPU emulation level (Skylake+ for modern desktop)
cpu_level=5

# Enable modern instruction sets
enable_sse42=true
enable_avx=true
enable_avx2=true

# Enable AES-NI for encryption
enable_aesni=true

# ============================================================================
# SECURITY SETTINGS
# ============================================================================

securelevel=1
mac_enforce=true
veriexec_check=auto
audit_enabled=true
audit_buffer_size=4096

# ============================================================================
# RESOURCE LIMITS - Balanced desktop
# ============================================================================

max_instances=8
max_memory_mb=32768
max_vcpus=16
memory_warn_percent=75
oom_protection=true
rctl_enabled=true

# Standard huge page behavior
huge_pages=auto
numa_aware=true

# ============================================================================
# DEVICE CONFIGURATION - Desktop with graphics
# ============================================================================

devices=desktop

# Standard network
network_device=virtio-net
network_queues=4

# Standard storage
storage_device=virtio-blk
storage_queues=4

# Memory balloon for dynamic adjustment
balloon_device=virtio-balloon
balloon_interval=15

# Standard RNG
rng_device=virtio-rng

# 9P filesystem sharing
fs_device=virtio-9p
fs_cache=mmap

# ============================================================================
# GPU CONFIGURATION
# ============================================================================

# Enable GPU for desktop use (if available)
video_device=virtio-gpu
video_memory=256M

# ============================================================================
# DEFAULT INSTANCE SETTINGS
# ============================================================================

default_memory=4G
default_cpus=4
default_arch=amd64
default_mode=balanced

instance_dir=/var/emu
image_cache_dir=/var/cache/emu/images

# ============================================================================
# OUTPUT SETTINGS
# ============================================================================

output_format=text
verbose=no
