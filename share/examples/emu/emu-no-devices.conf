# emu-no-devices.conf - No Devices Configuration
# CPU/Memory only, no hardware devices
#
# Use case: Pure computation workloads, compile farms, batch processing,
# or environments where hardware emulation is not needed.
#
# Installation: Copy to /usr/local/etc/emu/emu.conf

# ============================================================================
# ARCHITECTURE SETTINGS
# ============================================================================

arch=amd64
cpu_level=3
enable_avx=true
enable_avx512=true
enable_aesni=true

# Enable all CPU features for maximum performance
cpu_features=all

# ============================================================================
# SECURITY SETTINGS
# ============================================================================

securelevel=3
mac_enforce=true
veriexec_check=true
audit_enabled=true
audit_buffer_size=8192

# Network isolation for security
network_isolation=true

# ============================================================================
# RESOURCE LIMITS
# ============================================================================

max_instances=128
max_memory_mb=131072
max_vcpus=64
memory_warn_percent=90
oom_protection=true
rctl_enabled=true

# ============================================================================
# DEVICE CONFIGURATION - NONE
# ============================================================================

devices=none

# All devices disabled
network_device=disable
storage_device=disable
rng_device=disable
balloon_device=disable
fs_device=disable
audio_device=disable
usb_device=disable
serial_enabled=false

# No console devices
console_device=none

# Only virtual console (HVC)
hvcd_enabled=true

# ============================================================================
# COMPUTE OPTIMIZATION
# ============================================================================

# CPU pinning for performance
cpu_pinning=true

# Huge pages for memory efficiency
huge_pages=true
huge_pages_size=2M

# NUMA awareness
numa_aware=true

# CPU frequency governor
cpu_governor=performance

# ============================================================================
# MEMORY SETTINGS
# ============================================================================

# Fixed memory allocation (no balloon)
balloon_enabled=false

# Memory overcommit allowed
memory_overcommit=true

# Huge page allocation
hugetlb_enabled=true

# ============================================================================
# DEFAULT INSTANCE SETTINGS
# ============================================================================

default_memory=16G
default_cpus=16
default_arch=amd64
default_mode=compute

instance_dir=/var/emu
image_cache_dir=/var/cache/emu/images

# ============================================================================
# OUTPUT SETTINGS
# ============================================================================

output_format=text
verbose=no

# ============================================================================
# USE CASES
# ============================================================================

# This configuration is ideal for:
# - High-performance computing (HPC)
# - Compile farms
# - Batch processing jobs
# - Scientific computing
# - Containerized workloads
# - Function as a Service (FaaS)
# - Microservices without hardware requirements
