# emu-amd64-gaming.conf - AMD64/x86-64 Gaming Configuration
# High-performance gaming with GPU pass-through and minimal latency
#
# Suitable for:
# - PC gaming with GPU pass-through (vfio-pci)
# - Competitive gaming (low latency)
# - Steam/PC game streaming
# - Retro gaming emulation
#
# Installation: Copy to /usr/local/etc/emu/emu.conf

# ============================================================================
# ARCHITECTURE SETTINGS - Gaming Optimized
# ============================================================================

# Target architecture
arch=amd64

# CPU emulation level (maximum performance)
cpu_level=6

# Enable all modern instruction sets
enable_sse42=true
enable_avx=true
enable_avx2=true
enable_avx512=true

# Enable AES-NI for encryption
enable_aesni=true

# Disable unnecessary legacy features
enable_pae=false

# ============================================================================
# SECURITY SETTINGS - Gaming (relaxed for performance)
# ============================================================================

securelevel=1
mac_enforce=false
veriexec_check=false
audit_enabled=false

# ============================================================================
# RESOURCE LIMITS - Gaming Workloads
# ============================================================================

max_instances=2
max_memory_mb=32768
max_vcpus=8
memory_warn_percent=80
oom_protection=true
rctl_enabled=true

# Gaming doesn't benefit much from huge pages
huge_pages=never
numa_aware=false

# ============================================================================
# DEVICE CONFIGURATION - Gaming with Video
# ============================================================================

devices=gaming

# Network - low latency
network_device=virtio-net
network_queues=2

# Storage - fast load times
storage_device=virtio-blk
storage_queues=4

# Memory balloon disabled for consistent frame times
balloon_device=disable

# RNG
rng_device=virtio-rng

# Filesystem sharing
fs_device=disable

# ============================================================================
# VIDEO CONFIGURATION - GPU Pass-through
# ============================================================================

# GPU device type
video_device=stdvga

# Resolution - 1080p or 1440p for gaming
video_width=1920
video_height=1080
video_bpp=32

# VNC for remote access (optional)
vnc_enabled=false
vnc_port=5900

# ============================================================================
# PERFORMANCE TUNING - Low Latency
# ============================================================================

# CPU scheduling
cpu_affinity=balanced
cpu_latency_target=low

# Memory
memory_hog_protection=false
ksm_enabled=false
thp_mode=never

# Network
network_latency_target=low

# ============================================================================
# DEFAULT INSTANCE SETTINGS
# ============================================================================

default_memory=8G
default_cpus=4
default_arch=amd64
default_mode=performance

instance_dir=/var/emu
image_cache_dir=/var/cache/emu/images

# ============================================================================
# OUTPUT SETTINGS
# ============================================================================

output_format=text
verbose=no

# ============================================================================
# COMPATIBILITY NOTES
# ============================================================================

# This configuration is optimized for:
# - GPU passthrough using vfio-pci
# - Minimal host overhead
# - Low latency networking
# - Fast storage access
#
# Requirements:
# - IOMMU (VT-d/AMD-Vi) enabled in BIOS
# - Separate GPU for host
# - GPU with UEFI GOP driver for boot
#
# Not suitable for:
# - Shared GPU (use desktop config)
# - Headless servers (use server config)
# - Maximum security (use security config)
