# emu-full-devices.conf - Full Device Configuration
# Complete emulation with all available devices
#
# Use case: Desktop emulation, legacy hardware support,
# comprehensive testing, or maximum hardware compatibility.
#
# Installation: Copy to /usr/local/etc/emu/emu.conf

# ============================================================================
# ARCHITECTURE SETTINGS
# ============================================================================

arch=amd64
cpu_level=3

# Full CPU features
enable_sse2=true
enable_sse3=true
enable_ssse3=true
enable_sse41=true
enable_sse42=true
enable_avx=true
enable_avx2=true
enable_avx512=true
enable_aesni=true

# ============================================================================
# SECURITY SETTINGS
# ============================================================================

securelevel=1
mac_enforce=true
veriexec_check=auto
audit_enabled=true
audit_buffer_size=8192

# ============================================================================
# RESOURCE LIMITS
# ============================================================================

max_instances=16
max_memory_mb=32768
max_vcpus=16
memory_warn_percent=80
oom_protection=true
rctl_enabled=true

# ============================================================================
# DEVICE CONFIGURATION - ALL DEVICES
# ============================================================================

devices=all

# ----------------------------------------------------------------------------
# Display/Graphics Devices
# ----------------------------------------------------------------------------

# Primary display adapter
video_device=virtio-gpu

# Secondary display (for multi-monitor)
video_device2=vmware-svga

# Framebuffer
video_memory=256M
video_resolution=1920x1080
video_fullscreen=true

# VNC server for remote display
vnc_enabled=true
vnc_port=5900
vnc_password_required=true

# ----------------------------------------------------------------------------
# Storage Devices
# ----------------------------------------------------------------------------

# Primary disk (boot)
storage_device=virtio-blk
storage_model=nvme

# Secondary disk
storage_device2=virtio-blk

# SCSI controller for legacy support
storage_scsi_enabled=true
storage_scsi_model=lsilogic

# CD/DVD drive
cdrom_enabled=true
cdrom_model=ide

# Floppy disk
floppy_enabled=true

# USB storage
usb_storage_enabled=true

# ----------------------------------------------------------------------------
# Network Devices
# ----------------------------------------------------------------------------

# Primary network
network_device=virtio-net
network_mode=bridged
network_bridge=bridge0

# Secondary network
network_device2=e1000

# Tertiary network
network_device3=vmxnet3

# ----------------------------------------------------------------------------
# Input Devices
# ----------------------------------------------------------------------------

# Keyboard
keyboard_model=usb
keyboard_layout=us

# Mouse
mouse_enabled=true
mouse_model=usbtablet
mouse_capture=true

# ----------------------------------------------------------------------------
# Audio Devices
# ----------------------------------------------------------------------------

# Sound card
audio_enabled=true
audio_model=hda
audio_output=jack

# ----------------------------------------------------------------------------
# USB Devices
# ----------------------------------------------------------------------------

# USB controller
usb_enabled=true
usb_model=xhci

# USB pass-through
usb_passthrough_enabled=true

# ----------------------------------------------------------------------------
# Serial/Parallel Devices
# ----------------------------------------------------------------------------

# Serial ports
serial_enabled=true
serial_port1=/dev/ttyu0
serial_port2=/dev/ttyu1

# Parallel port
parallel_enabled=true

# ----------------------------------------------------------------------------
# VirtIO Devices
# ----------------------------------------------------------------------------

# Memory balloon
balloon_device=virtio-balloon
balloon_autoinflate=true

# 9P filesystem
fs_device=virtio-9p
fs_share_path=/var/emu/shares
fs_security=mac

# Random number generator
rng_device=virtio-rng

# Watchdog timer
watchdog_enabled=true
watchdog_model=i6300esb

# ----------------------------------------------------------------------------
# Legacy/Bluetooth Devices
# ----------------------------------------------------------------------------

# Legacy devices
ps2_enabled=true

# Bluetooth controller
bluetooth_enabled=true

# ----------------------------------------------------------------------------
# TPM Device
# ----------------------------------------------------------------------------

# Trusted Platform Module
tpm_enabled=true
tpm_model=tis

# ----------------------------------------------------------------------------
# Memory Balloon Settings
# ----------------------------------------------------------------------------

balloon_autoinflate=true
balloon_autodeflate=true
balloon_target_mode=auto

# ----------------------------------------------------------------------------
# Network Isolation
# ----------------------------------------------------------------------------

network_isolation=false
network_promiscuous=false

# Firewall
firewall_enabled=true
firewall_rules=/etc/emu/firewall-full.rules

# ----------------------------------------------------------------------------
# Console Configuration
# ============================================================================

console_device=display
console_device2=serial

# ----------------------------------------------------------------------------
# DEFAULT INSTANCE SETTINGS
# ----------------------------------------------------------------------------

default_memory=8G
default_cpus=8
default_arch=amd64
default_mode=desktop

instance_dir=/var/emu
image_cache_dir=/var/cache/emu/images

# ----------------------------------------------------------------------------
# OUTPUT SETTINGS
# ----------------------------------------------------------------------------

output_format=text
verbose=no

# ----------------------------------------------------------------------------
# USE CASES
# ============================================================================

# This configuration is ideal for:
# - Desktop virtualization
# - Legacy hardware testing
# - Software compatibility testing
# - Full-featured emulated workstations
# - Maximum hardware compatibility
# - Gaming/graphics testing
# - Multi-monitor setups
