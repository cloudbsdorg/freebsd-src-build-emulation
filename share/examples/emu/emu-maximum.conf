# emu-maximum.conf - Maximum Security Configuration
# WARNING: Requires significant system configuration.
# Suitable for critical infrastructure and highly sensitive environments.
#
# This configuration provides the highest level of security with all
# available protections enabled. Performance may be reduced.
#
# Installation: Copy to /usr/local/etc/emu/emu.conf

# ============================================================================
# SECURITY SETTINGS (MAXIMUM)
# ============================================================================

# Maximum securelevel (3 = network-secure, cannot be lowered)
securelevel=3

# Enable MAC label enforcement
mac_enforce=true

# Enable binary integrity verification
veriexec_check=true

# Enable security auditing with large buffer
audit_enabled=true

# Maximum audit buffer for critical environments
audit_buffer_size=16384

# ============================================================================
# RESOURCE LIMITS (MINIMAL)
# ============================================================================

# Minimal concurrent instances
max_instances=8

# Minimal memory allocation
max_memory_mb=16384

# Minimal vCPU allocation
max_vcpus=4

# Conservative memory warning threshold
memory_warn_percent=60

# Enable OOM protection
oom_protection=true

# Enable rctl resource limits
rctl_enabled=true

# ============================================================================
# NETWORK SETTINGS (ISOLATED)
# ============================================================================

# Enable complete network isolation
network_isolation=true

# Use NAT for outbound connectivity
network_nat=true

# Enable VMM priority scheduling
vmm_strict_priority=true

# Strict firewall rules (specify your rules file)
firewall_rules=/etc/emu/firewall.rules

# ============================================================================
# SNAPSHOT/SHARE SETTINGS (MAXIMUM)
# ============================================================================

# Require MAC label for snapshots
snapshot_require_mac=true

# Require MAC label for shares
share_require_mac=true

# Enable share path validation
share_path_validation=true

# Only allow secure snapshot directory
snapshot_allowed_dirs=/secure/emu/snapshots

# ============================================================================
# DEBUG SETTINGS (DISABLED)
# ============================================================================

# Disable module debug output
module_debug=false

# Low audit verbosity
module_audit_level=3

# Check for conflicting modules
conflict_check=true

# ============================================================================
# MEMORY SETTINGS (MAXIMUM SECURITY)
# ============================================================================

# Disable memory balloon (fixed allocation)
balloon_enabled=false

# Enable memory encryption (if hardware available)
memory_encryption=true

# Enable swap encryption
swap_encryption=true

# Enable NUMA awareness
numa_aware=true

# Enable huge pages
huge_pages=true

# Pin to specific CPUs
cpu_affinity=0,1,2,3

# ============================================================================
# DEFAULT INSTANCE SETTINGS
# ============================================================================

# Secure directories
instance_dir=/var/emu
image_cache_dir=/var/cache/emu/images

# Default architecture and mode
default_arch=amd64
default_mode=auto
default_cpu_level=2

# Conservative resource allocation
default_memory=512M
default_cpus=2

# ============================================================================
# OUTPUT SETTINGS
# ============================================================================

output_format=text
verbose=no
