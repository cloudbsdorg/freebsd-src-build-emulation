# emu-storage-only.conf - Storage-Only Configuration
# Emulation with storage devices, no network
#
# Use case: Data processing, file servers, backup targets,
# or air-gapped environments requiring local storage only.
#
# Installation: Copy to /usr/local/etc/emu/emu.conf

# ============================================================================
# ARCHITECTURE SETTINGS
# ============================================================================

arch=amd64
cpu_level=3
enable_avx=true
enable_aesni=true

# ============================================================================
# SECURITY SETTINGS
# ============================================================================

securelevel=3
mac_enforce=true
veriexec_check=true
audit_enabled=true
audit_buffer_size=4096

# Enable network isolation
network_isolation=true

# ============================================================================
# RESOURCE LIMITS
# ============================================================================

max_instances=32
max_memory_mb=65536
max_vcpus=32
memory_warn_percent=70
oom_protection=true
rctl_enabled=true

# ============================================================================
# DEVICE CONFIGURATION - STORAGE ONLY
# ============================================================================

devices=storage

# Primary storage device
storage_device=virtio-blk

# Additional storage controllers
storage_controller=virtio-scsi

# Storage pools
storage_pool=/var/emu/storage-pool
storage_default_type=qcow2

# Enable 9P filesystem for host sharing
fs_device=virtio-9p
fs_share_path=/var/emu/shares

# Balloon for memory management
balloon_device=virtio-balloon

# Disable network devices
network_device=disable

# Console only
console_device=serial
serial_enabled=true

# ============================================================================
# STORAGE POLICIES
# ============================================================================

# Enable snapshot support
snapshot_enabled=true
snapshot_dir=/var/emu/snapshots

# Compression for snapshots
snapshot_compress=gzip

# Storage encryption
storage_encrypt=aes-256-xts

# ============================================================================
# DEFAULT INSTANCE SETTINGS
# ============================================================================

default_memory=8G
default_cpus=8
default_arch=amd64
default_mode=auto

instance_dir=/var/emu
image_cache_dir=/var/cache/emu/images

# ============================================================================
# OUTPUT SETTINGS
# ============================================================================

output_format=text
verbose=no

# ============================================================================
# USE CASES
# ============================================================================

# This configuration is ideal for:
# - Database servers
# - File servers (NFS/CIFS locally)
# - Backup targets
# - Data processing pipelines
# - Air-gapped secure environments
# - Archive systems
