# emu-amd64-laptop.conf - AMD64/x86-64 Laptop/Portable Configuration
# Power-efficient configuration for portable devices
#
# Suitable for:
# - Laptop virtualization
# - Battery-powered systems
# - Mobile development
# - Travel scenarios
# - On-the-go testing
#
# Installation: Copy to /usr/local/etc/emu/emu.conf

# ============================================================================
# ARCHITECTURE SETTINGS
# ============================================================================

# Target architecture
arch=amd64

# CPU emulation level (Balanced power/performance)
cpu_level=4

# Enable modern instruction sets (power efficient)
enable_sse42=true
enable_avx=true
enable_avx2=true
enable_aesni=true

# ============================================================================
# SECURITY SETTINGS
# ============================================================================

securelevel=1
mac_enforce=true
veriexec_check=auto
audit_enabled=true
audit_buffer_size=2048

# ============================================================================
# RESOURCE LIMITS - Power conscious
# ============================================================================

max_instances=4
max_memory_mb=8192
max_vcpus=4
memory_warn_percent=70
oom_protection=false
rctl_enabled=true

# Standard huge page behavior
huge_pages=auto
numa_aware=false

# ============================================================================
# DEVICE CONFIGURATION - Balanced with power saving
# ============================================================================

devices=portable

# Efficient network
network_device=virtio-net
network_queues=2

# Standard storage
storage_device=virtio-blk
storage_queues=2

# Memory balloon for power saving
balloon_device=virtio-balloon
balloon_interval=30

# Enable RNG
rng_device=virtio-rng

# Minimal filesystem sharing
fs_device=virtio-9p
fs_cache=mmap

# No video (or basic framebuffer)
video_device=cirrus
video_memory=16M

# ============================================================================
# POWER MANAGEMENT
# ============================================================================

# CPU power governor
cpu_governor=powersave

# Enable C-states
c_states=true

# Disable KSM (saves power)
ksm_enabled=false

# Aggressive memory ballooning
balloon_aggressive=true

# ============================================================================
# DEFAULT INSTANCE SETTINGS
# ============================================================================

default_memory=2G
default_cpus=2
default_arch=amd64
default_mode=power

instance_dir=/var/emu
image_cache_dir=/var/cache/emu/images

# ============================================================================
# OUTPUT SETTINGS
# ============================================================================

output_format=text
verbose=no
