# emu-amd64-legacy.conf - AMD64/x86-64 Legacy/Compatibility Configuration
# Broad compatibility for older hardware and legacy systems
#
# Suitable for:
# - Old hardware (pre-2010)
# - Virtual machines on older hypervisors
# - Compatibility testing
# - Legacy application support
# - Systems without AES-NI
#
# Installation: Copy to /usr/local/etc/emu/emu.conf

# ============================================================================
# ARCHITECTURE SETTINGS
# ============================================================================

# Target architecture
arch=amd64

# CPU emulation level (Broadwell baseline for compatibility)
cpu_level=3

# Basic instruction sets only
enable_sse42=true
enable_avx=false
enable_avx2=false
enable_avx512=false
enable_aesni=false

# Software emulation fallback
software_aes=true

# ============================================================================
# SECURITY SETTINGS
# ============================================================================

securelevel=1
mac_enforce=true
veriexec_check=auto
audit_enabled=true
audit_buffer_size=2048

# ============================================================================
# RESOURCE LIMITS - Moderate resources
# ============================================================================

max_instances=8
max_memory_mb=16384
max_vcpus=8
memory_warn_percent=75
oom_protection=true
rctl_enabled=true

# Standard huge page behavior
huge_pages=auto
numa_aware=false

# ============================================================================
# DEVICE CONFIGURATION - Compatible devices
# ============================================================================

devices=legacy

# Standard network (e1000 fallback if virtio unavailable)
network_device=e1000

# IDE storage for maximum compatibility
storage_device=ide

# Memory balloon
balloon_device=virtio-balloon
balloon_interval=20

# Basic RNG
rng_device=random

# No 9P (legacy systems)
fs_device=disable

# Legacy video
video_device=stdvga
video_memory=16M

# ============================================================================
# COMPATIBILITY OPTIONS
# ============================================================================

# ACPI support
acpi_enabled=true

# APIC mode
apic_mode=x2apic

# BIOS/UEFI
firmware=bios

# Timer mode
timer_mode=rtc

# ============================================================================
# DEFAULT INSTANCE SETTINGS
# ============================================================================

default_memory=2G
default_cpus=2
default_arch=amd64
default_mode=compatible

instance_dir=/var/emu
image_cache_dir=/var/cache/emu/images

# ============================================================================
# OUTPUT SETTINGS
# ============================================================================

output_format=text
verbose=no
