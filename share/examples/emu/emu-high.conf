# emu-high.conf - High Security Configuration
# Enhanced security for sensitive workloads.
# Suitable for production servers with sensitive data.
#
# This configuration provides strong security features with
# reasonable performance for production use.
#
# Installation: Copy to /usr/local/etc/emu/emu.conf

# ============================================================================
# SECURITY SETTINGS (ENHANCED)
# ============================================================================

# High securelevel (3 = network-secure, maximum protection)
securelevel=3

# Enable MAC label enforcement
mac_enforce=true

# Enable binary integrity verification
veriexec_check=true

# Enable security auditing with extended buffer
audit_enabled=true

# Larger audit buffer for high-traffic environments
audit_buffer_size=8192

# ============================================================================
# RESOURCE LIMITS (STRICT)
# ============================================================================

# Reduced concurrent instances
max_instances=16

# Reduced memory allocation
max_memory_mb=32768

# Reduced vCPU allocation
max_vcpus=8

# Lower memory warning threshold
memory_warn_percent=75

# Enable OOM protection
oom_protection=true

# Enable rctl resource limits
rctl_enabled=true

# ============================================================================
# NETWORK SETTINGS (ISOLATED)
# ============================================================================

# Enable network isolation
network_isolation=true

# Use NAT for outbound connectivity
network_nat=true

# Enable VMM priority scheduling
vmm_strict_priority=true

# ============================================================================
# SNAPSHOT/SHARE SETTINGS (STRICT)
# ============================================================================

# Require MAC label for snapshots
snapshot_require_mac=true

# Require MAC label for shares
share_require_mac=true

# Enable share path validation
share_path_validation=true

# Restrict snapshot directories
snapshot_allowed_dirs=/var/emu/snapshots,/secure/emu/snapshots

# ============================================================================
# DEBUG SETTINGS (DISABLED)
# ============================================================================

# Disable module debug output
module_debug=false

# Moderate audit verbosity
module_audit_level=2

# Check for conflicting modules
conflict_check=true

# ============================================================================
# MEMORY SETTINGS (SECURE)
# ============================================================================

# Enable memory balloon for dynamic adjustment
balloon_enabled=true

# Enable memory encryption (if hardware available)
memory_encryption=true

# Enable swap encryption
swap_encryption=true

# Enable NUMA awareness
numa_aware=true

# Enable huge pages for reduced TLB pressure
huge_pages=true

# ============================================================================
# DEFAULT INSTANCE SETTINGS
# ============================================================================

# Default directories
instance_dir=/var/emu
image_cache_dir=/var/cache/emu/images

# Default architecture and mode
default_arch=amd64
default_mode=auto
default_cpu_level=2

# Default resource allocation
default_memory=512M
default_cpus=2

# ============================================================================
# OUTPUT SETTINGS
# ============================================================================

output_format=text
verbose=no
