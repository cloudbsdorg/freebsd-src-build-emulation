# emu-amd64-minimal.conf - AMD64/x86-64 Minimal Configuration
# Ultra-lightweight configuration for resource-constrained environments
#
# Suitable for:
# - Embedded systems
# - IoT gateways
# - Container runtimes
# - Minimal VPS instances
# - Edge computing
#
# Installation: Copy to /usr/local/etc/emu/emu.conf

# ============================================================================
# ARCHITECTURE SETTINGS
# ============================================================================

# Target architecture
arch=amd64

# CPU emulation level (Broad compatibility)
cpu_level=3

# Minimal instruction sets (SSE2 is baseline)
enable_sse42=false
enable_avx=false
enable_avx2=false
enable_aesni=false

# ============================================================================
# SECURITY SETTINGS
# ============================================================================

securelevel=1
mac_enforce=true
veriexec_check=auto
audit_enabled=true
audit_buffer_size=1024

# ============================================================================
# RESOURCE LIMITS - Minimal footprint
# ============================================================================

max_instances=2
max_memory_mb=2048
max_vcpus=2
memory_warn_percent=90
oom_protection=false
rctl_enabled=true

# Disable features for minimal memory
huge_pages=never
numa_aware=false

# ============================================================================
# DEVICE CONFIGURATION - Bare minimum
# ============================================================================

devices=minimal

# Minimal network
network_device=virtio-net
network_queues=1

# Minimal storage
storage_device=virtio-blk
storage_queues=1

# No memory balloon (fixed allocation)
balloon_device=disable

# No RNG
rng_device=disable

# No filesystem sharing
fs_device=disable

# No video
video_device=none

# ============================================================================
# MEMORY OPTIMIZATIONS
# ============================================================================

# Disable KSM
ksm_enabled=false

# Minimal buffer sizes
network_buffers=4096

# ============================================================================
# DEFAULT INSTANCE SETTINGS
# ============================================================================

default_memory=256M
default_cpus=1
default_arch=amd64
default_mode=minimal

instance_dir=/var/emu
image_cache_dir=/var/cache/emu/images

# ============================================================================
# OUTPUT SETTINGS
# ============================================================================

output_format=text
verbose=no
