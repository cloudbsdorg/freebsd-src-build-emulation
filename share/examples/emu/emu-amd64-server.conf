# emu-amd64-server.conf - AMD64/x86-64 Server Configuration
# Optimized for server workloads: high CPU, high memory, network intensive
#
# Suitable for:
# - Web servers, application servers
# - Database servers (SQL/NoSQL)
# - Container hosts
# - API endpoints
# - Microservices
#
# Installation: Copy to /usr/local/etc/emu/emu.conf

# ============================================================================
# ARCHITECTURE SETTINGS
# ============================================================================

# Target architecture
arch=amd64

# CPU emulation level (Broadwell+ for best performance)
cpu_level=6

# Enable latest instruction sets
enable_sse42=true
enable_avx=true
enable_avx2=true
enable_avx512=true

# Enable AES-NI for encryption acceleration
enable_aesni=true

# Disable unnecessary legacy features
enable_pae=false
enable_noexecute=false

# ============================================================================
# SECURITY SETTINGS
# ============================================================================

securelevel=3
mac_enforce=true
veriexec_check=auto
audit_enabled=true
audit_buffer_size=8192

# ============================================================================
# RESOURCE LIMITS - High capacity server
# ============================================================================

max_instances=64
max_memory_mb=1048576
max_vcpus=128
memory_warn_percent=85
oom_protection=true
rctl_enabled=true

# CPU affinity for NUMA
numa_aware=true
huge_pages=always

# Network optimization
network_buffers=65536
network_queues=16

# ============================================================================
# DEVICE CONFIGURATION - Server optimized
# ============================================================================

devices=server

# High-performance network
network_device=virtio-net
network_queues=16
network_offload=tso6

# High-performance storage
storage_device=virtio-blk
storage_queues=16
storage_discard=true

# Enable balloon for memory overcommit
balloon_device=virtio-balloon
balloon_interval=10

# Disable GPU (servers don't need it)
video_device=none

# Enable high-performance RNG
rng_device=virtio-rng

# Filesystem sharing
fs_device=virtio-9p
fs_cache=loose

# ============================================================================
# DEFAULT INSTANCE SETTINGS
# ============================================================================

default_memory=16G
default_cpus=8
default_arch=amd64
default_mode=performance

instance_dir=/var/emu
image_cache_dir=/var/cache/emu/images

# ============================================================================
# PERFORMANCE TUNING
# ============================================================================

# Disable debug features
verbose=no
debug_mode=no

# Enable kernel same-page merging
ksm_enabled=true

# Enable transparent huge pages
thp_mode=always

# ============================================================================
# OUTPUT SETTINGS
# ============================================================================

output_format=text
verbose=no
