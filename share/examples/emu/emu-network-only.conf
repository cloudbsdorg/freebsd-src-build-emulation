# emu-network-only.conf - Network-Only Configuration
# Emulation with networking, minimal other devices
#
# Use case: Network application testing, firewall/drouter emulation,
# network services, or when you only need network connectivity.
#
# Installation: Copy to /usr/local/etc/emu/emu.conf

# ============================================================================
# ARCHITECTURE SETTINGS
# ============================================================================

arch=amd64
cpu_level=3
enable_avx=true
enable_aesni=true

# ============================================================================
# SECURITY SETTINGS
# ============================================================================

securelevel=1
mac_enforce=true
veriexec_check=auto
audit_enabled=true
audit_buffer_size=2048

# ============================================================================
# RESOURCE LIMITS
# ============================================================================

max_instances=64
max_memory_mb=32768
max_vcpus=16
memory_warn_percent=80
oom_protection=true
rctl_enabled=true

# ============================================================================
# DEVICE CONFIGURATION - NETWORK ONLY
# ============================================================================

devices=network

# Primary network device
network_device=virtio-net

# Network configuration
network_bridge=bridge0
network_mode=bridged

# Enable VirtIO RNG for entropy (no other devices)
rng_device=virtio-rng

# Disable all other devices
storage_device=disable
balloon_device=disable
fs_device=disable
audio_device=disable
usb_device=disable

# Serial console only
console_device=serial
serial_enabled=true

# ============================================================================
# DEFAULT INSTANCE SETTINGS
# ============================================================================

default_memory=1G
default_cpus=2
default_arch=amd64
default_mode=auto

instance_dir=/var/emu
image_cache_dir=/var/cache/emu/images

# ============================================================================
# OUTPUT SETTINGS
# ============================================================================

output_format=text
verbose=no

# ============================================================================
# USE CASES
# ============================================================================

# This configuration is ideal for:
# - Router/firewall appliances
# - Network monitoring stations
# - DNS/DHCP servers
# - Load balancer nodes
# - VPN endpoints
# - Network analysis tools
