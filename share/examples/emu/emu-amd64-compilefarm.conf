# emu-amd64-compilefarm.conf - AMD64/x86-64 Compile Farm Configuration
# High-performance configuration for build servers and HPC workloads
#
# Suitable for:
# - Software build servers
# - Continuous integration runners
# - Compiler farms
# - Parallel computation
# - Distributed builds
#
# Installation: Copy to /usr/local/etc/emu/emu.conf

# ============================================================================
# ARCHITECTURE SETTINGS
# ============================================================================

# Target architecture
arch=amd64

# CPU emulation level (Maximum performance)
cpu_level=6

# Enable all performance instruction sets
enable_sse42=true
enable_avx=true
enable_avx2=true
enable_avx512=true
enable_aesni=true

# Enable SHA extensions for faster package verification
enable_sha=true

# ============================================================================
# SECURITY SETTINGS
# ============================================================================

securelevel=1
mac_enforce=true
veriexec_check=auto
audit_enabled=true
audit_buffer_size=4096

# ============================================================================
# RESOURCE LIMITS - Compute intensive
# ============================================================================

max_instances=16
max_memory_mb=262144
max_vcpus=64
memory_warn_percent=90
oom_protection=true
rctl_enabled=true

# Maximum performance settings
huge_pages=always
numa_aware=true

# ============================================================================
# DEVICE CONFIGURATION - Minimal I/O, maximum compute
# ============================================================================

devices=compute

# Minimal network (just for coordination)
network_device=virtio-net
network_queues=2

# High-speed storage for build artifacts
storage_device=virtio-blk
storage_queues=8
storage_cache=writeback

# Disable balloon (want predictable memory)
balloon_device=disable

# Disable filesystem sharing (use network instead)
fs_device=disable

# Enable fast RNG
rng_device=virtio-rng

# No video
video_device=none

# ============================================================================
# COMPUTE OPTIMIZATIONS
# ============================================================================

# CPU governor
cpu_governor=performance

# Enable kernel same-page merging
ksm_enabled=true

# Pre-allocate memory
preallocate_memory=true

# Lock memory to prevent swapping during builds
lock_memory=true

# ============================================================================
# DEFAULT INSTANCE SETTINGS
# ============================================================================

default_memory=8G
default_cpus=16
default_arch=amd64
default_mode=performance

instance_dir=/var/emu
image_cache_dir=/var/cache/emu/images

# ============================================================================
# OUTPUT SETTINGS
# ============================================================================

output_format=text
verbose=no
