# emu-amd64-headless.conf - AMD64/x86-64 Headless Configuration
# Server configuration without video output
#
# Suitable for:
# - Background services and daemons
# - Headless servers
# - Container workloads
# - Automated testing/CI pipelines
# - Build servers
#
# Installation: Copy to /usr/local/etc/emu/emu.conf

# ============================================================================
# ARCHITECTURE SETTINGS - Standard Server
# ============================================================================

# Target architecture
arch=amd64

# CPU emulation level
cpu_level=5

# Enable modern instruction sets
enable_sse42=true
enable_avx=true
enable_avx2=true
enable_avx512=true

# Enable AES-NI for encryption
enable_aesni=true

# ============================================================================
# SECURITY SETTINGS - Server Security
# ============================================================================

securelevel=3
mac_enforce=true
veriexec_check=auto
audit_enabled=true
audit_buffer_size=8192

# ============================================================================
# RESOURCE LIMITS - High Capacity
# ============================================================================

max_instances=32
max_memory_mb=524288
max_vcpus=64
memory_warn_percent=85
oom_protection=true
rctl_enabled=true

# Server memory optimizations
huge_pages=always
numa_aware=true

# ============================================================================
# DEVICE CONFIGURATION - No Video, Network/Storage Focus
# ============================================================================

devices=headless

# Network - high performance
network_device=virtio-net
network_queues=16
network_offload=tso6

# Storage - high performance
storage_device=virtio-blk
storage_queues=16
storage_discard=true

# Enable balloon for memory overcommit
balloon_device=virtio-balloon
balloon_interval=10

# RNG for crypto operations
rng_device=virtio-rng

# Filesystem sharing
fs_device=virtio-9p
fs_cache=loose

# ============================================================================
# VIDEO CONFIGURATION - Disabled (Headless)
# ============================================================================

# No video device
video_device=none

# No VNC (console only)
vnc_enabled=false

# ============================================================================
# PERFORMANCE TUNING - Maximum Performance
# ============================================================================

# CPU scheduling - performance
cpu_affinity=numa
cpu_latency_target=low

# Memory optimizations
memory_hog_protection=false
ksm_enabled=true
thp_mode=always

# Network optimizations
network_latency_target=low
network_buffers=65536

# ============================================================================
# CONSOLE CONFIGURATION
# ============================================================================

console_type=serial
serial_console=socket
serial_speed=115200

# ============================================================================
# DEFAULT INSTANCE SETTINGS
# ============================================================================

default_memory=8G
default_cpus=4
default_arch=amd64
default_mode=performance

instance_dir=/var/emu
image_cache_dir=/var/cache/emu/images

# ============================================================================
# OUTPUT SETTINGS
# ============================================================================

output_format=text
verbose=no
debug_mode=no

# ============================================================================
# COMPATIBILITY NOTES
# ============================================================================

# This configuration is optimized for:
# - Maximum server performance
# - Headless operation (no display)
# - Network-intensive workloads
# - Storage-intensive workloads
# - Container/VM hosting
#
# Access methods:
# - Serial console via socket: nc -U /var/emu/instances/<name>/console.sock
# - SSH into guest OS (requires guest networking)
# - VNC not available (headless)
#
# Best practices:
# - Use securelevel=3 for production
# - Enable audit for compliance
# - Use veriexec for binary integrity
# - Monitor with SNMP or similar
#
# Not suitable for:
# - Desktop use (use desktop config)
# - GUI applications
# - Gaming (use gaming config)
