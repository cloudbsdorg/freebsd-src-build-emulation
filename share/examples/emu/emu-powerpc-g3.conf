# emu-powerpc-g3.conf - PowerPC G3 Mac Clone Configuration
# Classic Mac OS X / Mac OS 9 emulation style configuration
#
# Emulates a Power Macintosh G3 (Beige or Blue & White) with:
# - PowerPC 750 (G3) processor
# - Classic Mac OS or early Mac OS X support
# - Old World ROM compatibility
# - Nubus/PCI slot emulation
#
# This configuration mimics the hardware of the late 1990s Apple Macintosh
# computers popular in education and creative industries.
#
# Installation: Copy to /usr/local/etc/emu/emu.conf

# ============================================================================
# ARCHITECTURE SETTINGS
# ============================================================================

# Target architecture
arch=powerpc

# CPU model - PowerPC 750 (G3)
cpu_model=750

# CPU speed emulation (333MHz typical G3)
cpu_speed=333

# Old World ROM support
rom_type=oldworld

# Enable FPU (always enabled on G3)
enable_fpu=true

# Disable AltiVec (G3 doesn't have it, G4 does)
enable_altivec=false

# Memory model - 32-bit physical address space
phys_addr_bits=32

# ============================================================================
# HARDWARE COMPATIBILITY
# ============================================================================

# Video configuration - ATI Rage 128 style
video_model=ati-rage-128
video_memory=8M

# Sound - Apple Sound Chip (ASC) compatible
audio_model=asc

# Network - Apple MACE Ethernet
network_model=mace

# USB - OpenHCI (USB 1.1)
usb_model=ohci

# ADB (Apple Desktop Bus) emulation
adb_enabled=true

# SCSI emulation for external devices
scsi_enabled=true
scsi_model=53c975

# ============================================================================
# MAC-SPECIFIC SETTINGS
# ============================================================================

# Mac OS version compatibility
target_os=classic

# Open Firmware enabled
open_firmware=true

# NVRAM settings
nvram_size=4K

# PRAM (Parameter RAM) emulation
pram_enabled=true

# Bus timing - PCI/60x bus
bus_type= pci
bus_speed=50

# Interrupt controller - Heathrow style
interrupt_ctrl=heathrow

# ============================================================================
# BOOT DEVICE SETTINGS
# ============================================================================

# Primary boot device
boot_device=ide0

# Secondary boot device
alt_boot_device=scsi0

# CD-ROM drive
cdrom_model=ide

# Floppy drive (1.44MB)
floppy_enabled=true

# ============================================================================
# SECURITY SETTINGS (Minimal for legacy OS)
# ============================================================================

securelevel=-1
mac_enforce=false
veriexec_check=false
audit_enabled=false

# ============================================================================
# RESOURCE LIMITS (Conservative for older OS)
# ============================================================================

max_instances=4
max_memory_mb=1536
max_vcpus=1
memory_warn_percent=85
oom_protection=false
rctl_enabled=false

# ============================================================================
# DEVICE CONFIGURATION
# ============================================================================

# Minimal devices for classic Mac compatibility
devices=basic

# Disable balloon (not supported in classic Mac OS)
balloon_device=disable

# Disable 9P filesystem
fs_device=disable

# Enable basic serial ports for modem/printers
serial_enabled=true

# ============================================================================
# DEFAULT INSTANCE SETTINGS
# ============================================================================

# Typical G3 memory configuration
default_memory=512M
default_cpus=1
default_arch=powerpc
default_mode=classic

instance_dir=/var/emu
image_cache_dir=/var/cache/emu/images

# ============================================================================
# OUTPUT SETTINGS
# ============================================================================

output_format=text
verbose=no

# ============================================================================
# COMPATIBILITY NOTES
# ============================================================================

# This configuration emulates hardware compatible with:
# - Mac OS 8.6 - 9.2.2
# - Early Mac OS X 10.0 - 10.3 (Darwin 6-7)
#
# Not compatible with:
# - Mac OS X 10.4+ (requires G4/G5)
# - New World ROM machines
# - UFS booting (use HFS+)
#
# Known limitations:
# - No hardware graphics acceleration
# - Sound quality depends on host audio system
# - Network may require host bridge configuration
