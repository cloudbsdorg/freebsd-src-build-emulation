# emu-amd64-multimedia.conf - AMD64/x86-64 Multimedia Configuration
# Media center and home theater PC (HTPC) configuration
#
# Suitable for:
# - Kodi/PLEX media center
# - Video transcoding
# - Audio/video production
# - Home automation servers
#
# Installation: Copy to /usr/local/etc/emu/emu.conf

# ============================================================================
# ARCHITECTURE SETTINGS - Media Optimized
# ============================================================================

# Target architecture
arch=amd64

# CPU emulation level
cpu_level=5

# Enable modern instruction sets for hardware acceleration
enable_sse42=true
enable_avx=true
enable_avx2=true

# Enable AES-NI for encryption
enable_aesni=true

# ============================================================================
# SECURITY SETTINGS - Home Network (Moderate)
# ============================================================================

securelevel=1
mac_enforce=true
veriexec_check=auto
audit_enabled=true
audit_buffer_size=2048

# ============================================================================
# RESOURCE LIMITS - Media Center
# ============================================================================

max_instances=2
max_memory_mb=16384
max_vcpus=4
memory_warn_percent=75
oom_protection=true
rctl_enabled=true

# Enable huge pages for video buffer efficiency
huge_pages=auto
numa_aware=false

# ============================================================================
# DEVICE CONFIGURATION - Multimedia
# ============================================================================

devices=multimedia

# Network - home network speeds adequate
network_device=virtio-net
network_queues=2

# Storage - prioritize sequential read
storage_device=virtio-blk
storage_queues=2

# Memory balloon disabled for consistent playback
balloon_device=disable

# RNG
rng_device=virtio-rng

# Filesystem sharing - for media libraries
fs_device=virtio-9p
fs_cache=mmap

# ============================================================================
# VIDEO CONFIGURATION - HTPC Output
# ============================================================================

# GPU device type - prefer low power
video_device=virtio-gpu

# Resolution - common HTPC output
video_width=1920
video_height=1080
video_bpp=32

# VNC for remote administration
vnc_enabled=true
vnc_port=5900
vnc_password=

# ============================================================================
# AUDIO CONFIGURATION
# ============================================================================

audio_enabled=true
audio_model=hda
audio_driver=passthrough

# ============================================================================
# PERFORMANCE TUNING - Smooth Playback
# ============================================================================

# CPU scheduling - favor background tasks
cpu_affinity=background
cpu_latency_target=normal

# Memory - reserve for video buffers
memory_reserve_mb=2048
ksm_enabled=false
thp_mode=madvise

# ============================================================================
# DEFAULT INSTANCE SETTINGS
# ============================================================================

default_memory=4G
default_cpus=2
default_arch=amd64
default_mode=balanced

instance_dir=/var/emu
image_cache_dir=/var/cache/emu/images

# ============================================================================
# OUTPUT SETTINGS
# ============================================================================

output_format=text
verbose=no

# ============================================================================
# COMPATIBILITY NOTES
# ============================================================================

# This configuration is optimized for:
# - Hardware video decode/encode (if available)
# - Low power consumption
# - Quiet operation (no excessive CPU spinning)
# - 24/7 operation
#
# Suitable operating systems:
# - FreeBSD with desktop environment
# - Linux (Ubuntu, Fedora, Arch)
# - Windows 10/11
#
# Known limitations:
# - Limited GPU pass-through support
# - No hardware 3D acceleration
# - Audio passthrough requires guest drivers
