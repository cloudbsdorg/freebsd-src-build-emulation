# emu-amd64-legacy-compat.conf - AMD64/x86-64 Legacy Compatibility
# Configuration for running older operating systems (Windows 7, XP, etc.)
#
# Suitable for:
# - Running legacy Windows versions
# - Running older software that requires specific hardware
# - Testing compatibility with legacy applications
# - Legacy gaming
#
# Installation: Copy to /usr/local/etc/emu/emu.conf

# ============================================================================
# ARCHITECTURE SETTINGS - Legacy Compatible
# ============================================================================

# Target architecture
arch=amd64

# CPU emulation level - legacy compatibility
cpu_level=2

# Limit to SSE2 for maximum compatibility
enable_sse42=true
enable_avx=false
enable_avx2=false
enable_avx512=false

# Disable AES-NI (legacy OS may not use it)
enable_aesni=false

# Enable legacy features
enable_pae=true

# ============================================================================
# SECURITY SETTINGS - Minimal (legacy OS)
# ============================================================================

securelevel=-1
mac_enforce=false
veriexec_check=false
audit_enabled=false

# ============================================================================
# RESOURCE LIMITS - Legacy Workloads
# ============================================================================

max_instances=2
max_memory_mb=8192
max_vcpus=4
memory_warn_percent=85
oom_protection=false
rctl_enabled=false

# Disable modern memory features
huge_pages=never
numa_aware=false

# ============================================================================
# DEVICE CONFIGURATION - Legacy Hardware Emulation
# ============================================================================

devices=legacy

# Network - e1000 for Windows compatibility
network_device=e1000
network_queues=1

# Storage - IDE for older OS
storage_device=ide
storage_queues=1

# Disable balloon (not supported in legacy OS)
balloon_device=disable

# RNG - optional
rng_device=disable

# Filesystem sharing
fs_device=disable

# ============================================================================
# VIDEO CONFIGURATION - Legacy VGA/Cirrus
# ============================================================================

# GPU device type - Cirrus for legacy Windows
video_device=cirrus

# Resolution - typical for legacy OS
video_width=1024
video_height=768
video_bpp=32

# VNC for remote access
vnc_enabled=true
vnc_port=5900

# ============================================================================
# EMULATED HARDWARE - Legacy IDE/BIOS
# ============================================================================

# IDE controller emulation
ide_controller=i440fx
ide_mode=compatibility

# BIOS settings
bios_type=seabios
bios_legacy_mode=true

# ACPI settings - legacy OS may not support well
acpi_enabled=false

# USB - OHCI for legacy
usb_model=ohci
usb_xhci=false

# ============================================================================
# PERFORMANCE TUNING - Compatibility Over Speed
# ============================================================================

# CPU scheduling - legacy compatibility
cpu_affinity=balanced
cpu_latency_target=high

# Memory - no optimization
memory_hog_protection=false
ksm_enabled=false
thp_mode=never

# ============================================================================
# DEFAULT INSTANCE SETTINGS
# ============================================================================

default_memory=2G
default_cpus=2
default_arch=amd64
default_mode=legacy

instance_dir=/var/emu
image_cache_dir=/var/cache/emu/images

# ============================================================================
# OUTPUT SETTINGS
# ============================================================================

output_format=text
verbose=yes

# ============================================================================
# COMPATIBILITY NOTES
# ============================================================================

# This configuration is optimized for:
# - Windows XP, Vista, 7 compatibility
# - Legacy application support
# - DOS/early Windows gaming
# - Software that requires specific hardware (old dongles, etc.)
#
# Compatible operating systems:
# - Windows XP 32-bit/64-bit
# - Windows Vista, 7
# - Windows Server 2003/2008
# - DOS 6.22, 7.x
# - Windows 3.11, 95, 98, ME
# - Some early Linux distributions
#
# Known limitations:
# - Limited to 4GB RAM (or 8GB with PAE)
# - No modern hardware acceleration
# - Limited USB support
# - No UEFI boot
#
# Tips for legacy OS:
# - Install guest additions for better performance
# - Use IDE/AHCI mode for storage (not VirtIO)
# - Use E1000 network for Windows
# - Enable ACPI only if OS supports it
