# emu-arm64-server.conf - ARM64/AArch64 Server Configuration
# High-performance ARM64 server configuration
#
# Suitable for:
# - ARM-based servers (Ampere, AWS Graviton)
# - Edge computing servers
# - Container hosts
# - Cloud workloads on ARM64
#
# Installation: Copy to /usr/local/etc/emu/emu.conf

# ============================================================================
# ARCHITECTURE SETTINGS
# ============================================================================

# Target architecture
arch=arm64

# CPU model (Neoverse N1 compatible)
cpu_model=neoverse-n1

# Enable ARMv8.2 features
enable_armv82=true

# Enable NEON SIMD
enable_neon=true

# Enable Cryptography Extensions
enable_crypto=true

# Enable Floating Point Unit
enable_fpu=true

# ============================================================================
# SECURITY SETTINGS
# ============================================================================

securelevel=3
mac_enforce=true
veriexec_check=auto
audit_enabled=true
audit_buffer_size=8192

# ============================================================================
# RESOURCE LIMITS - High capacity server
# ============================================================================

max_instances=64
max_memory_mb=524288
max_vcpus=128
memory_warn_percent=85
oom_protection=true
rctl_enabled=true

# Server optimizations
huge_pages=always
numa_aware=true

# ============================================================================
# DEVICE CONFIGURATION - Server optimized
# ============================================================================

devices=server

# High-performance network
network_device=virtio-net
network_queues=16

# High-performance storage
storage_device=virtio-blk
storage_queues=16

# Enable balloon
balloon_device=virtio-balloon
balloon_interval=10

# Disable GPU
video_device=none

# High-performance RNG
rng_device=virtio-rng

# Filesystem sharing
fs_device=virtio-9p

# ============================================================================
# DEFAULT INSTANCE SETTINGS
# ============================================================================

default_memory=16G
default_cpus=8
default_arch=arm64
default_mode=performance

instance_dir=/var/emu
image_cache_dir=/var/cache/emu/images

# ============================================================================
# OUTPUT SETTINGS
# ============================================================================

output_format=text
verbose=no
