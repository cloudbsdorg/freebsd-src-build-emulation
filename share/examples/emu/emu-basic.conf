# emu-basic.conf - Basic Development Configuration
# WARNING: This configuration is INSECURE and should only be used
# in isolated development environments with no network connectivity.
#
# This configuration disables all security features for maximum
# performance and debugging capability.
#
# Installation: Copy to /usr/local/etc/emu/emu.conf

# ============================================================================
# SECURITY SETTINGS (ALL DISABLED)
# ============================================================================

# Disable kernel securelevel (-1 = permanently insecure)
securelevel=-1

# Disable MAC label enforcement
mac_enforce=false

# Disable binary integrity verification
veriexec_check=false

# Disable security auditing
audit_enabled=false

# ============================================================================
# RESOURCE LIMITS (UNRESTRICTED)
# ============================================================================

# Allow many concurrent instances
max_instances=128

# Allow large memory allocation
max_memory_mb=131072

# Allow many vCPUs
max_vcpus=32

# Warn at high memory usage
memory_warn_percent=90

# Disable OOM protection
oom_protection=false

# Disable rctl resource limits
rctl_enabled=false

# ============================================================================
# NETWORK SETTINGS (PERMISSIVE)
# ============================================================================

# Disable network isolation
network_isolation=false

# Use NAT for outbound connectivity
network_nat=true

# Disable VMM priority
vmm_strict_priority=false

# ============================================================================
# SNAPSHOT/SHARE SETTINGS (UNRESTRICTED)
# ============================================================================

# Disable MAC label requirement for snapshots
snapshot_require_mac=false

# Disable MAC label requirement for shares
share_require_mac=false

# Disable share path validation
share_path_validation=false

# ============================================================================
# DEBUG SETTINGS (ENABLED)
# ============================================================================

# Enable module debug output
module_debug=true

# Maximum audit verbosity
module_audit_level=4

# Check for conflicting modules
conflict_check=true

# ============================================================================
# MEMORY SETTINGS (PERFORMANCE)
# ============================================================================

# Enable memory balloon for dynamic adjustment
balloon_enabled=true

# Disable memory encryption
memory_encryption=false

# Disable swap encryption
swap_encryption=false

# Disable NUMA awareness
numa_aware=false

# Disable huge pages
huge_pages=false

# ============================================================================
# DEFAULT INSTANCE SETTINGS
# ============================================================================

# Default directories
instance_dir=/var/emu
image_cache_dir=/var/cache/emu/images

# Default architecture and mode
default_arch=amd64
default_mode=auto
default_cpu_level=2

# Default resource allocation
default_memory=512M
default_cpus=2

# ============================================================================
# OUTPUT SETTINGS
# ============================================================================

output_format=text
verbose=yes
