# emu-amd64.conf - AMD64/x86-64 Configuration
# Standard configuration for x86-64 (Intel/AMD) processors
#
# This is the default architecture for most modern systems.
# Suitable for general-purpose emulation workloads.
#
# Installation: Copy to /usr/local/etc/emu/emu.conf

# ============================================================================
# ARCHITECTURE SETTINGS
# ============================================================================

# Target architecture
arch=amd64

# CPU emulation level
cpu_level=3

# Enable SSE4.2 support
enable_sse42=true

# Enable AVX/AVX2 support
enable_avx=true

# Enable AES-NI for encryption acceleration
enable_aesni=true

# ============================================================================
# SECURITY SETTINGS
# ============================================================================

securelevel=1
mac_enforce=true
veriexec_check=auto
audit_enabled=true
audit_buffer_size=4096

# ============================================================================
# RESOURCE LIMITS
# ============================================================================

max_instances=32
max_memory_mb=65536
max_vcpus=64
memory_warn_percent=80
oom_protection=true
rctl_enabled=true

# ============================================================================
# DEVICE CONFIGURATION
# ============================================================================

# Enable all standard devices
devices=all

# Network device
network_device=virtio-net

# Storage device  
storage_device=virtio-blk

# RNG device
rng_device=virtio-rng

# Balloon device
balloon_device=virtio-balloon

# 9P filesystem device
fs_device=virtio-9p

# ============================================================================
# DEFAULT INSTANCE SETTINGS
# ============================================================================

default_memory=4G
default_cpus=4
default_arch=amd64
default_mode=auto

instance_dir=/var/emu
image_cache_dir=/var/cache/emu/images

# ============================================================================
# OUTPUT SETTINGS
# ============================================================================

output_format=text
verbose=no
