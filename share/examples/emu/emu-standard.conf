# emu-standard.conf - Standard Configuration
# Balanced security for general purpose emulation.
# Suitable for development servers and testing environments.
#
# This configuration balances security and usability with moderate
# restrictions while maintaining good performance.
#
# Installation: Copy to /usr/local/etc/emu/emu.conf

# ============================================================================
# SECURITY SETTINGS (BALANCED)
# ============================================================================

# Standard securelevel (1 = secure, can be raised)
securelevel=1

# Enable MAC label enforcement
mac_enforce=true

# Enable binary integrity verification (auto-detect if available)
veriexec_check=auto

# Enable security auditing
audit_enabled=true

# Audit buffer size (number of events)
audit_buffer_size=2048

# ============================================================================
# RESOURCE LIMITS (MODERATE)
# ============================================================================

# Moderate concurrent instances
max_instances=32

# Moderate memory allocation
max_memory_mb=65536

# Moderate vCPU allocation
max_vcpus=16

# Warn at high memory usage
memory_warn_percent=85

# Enable OOM protection
oom_protection=true

# Enable rctl resource limits
rctl_enabled=true

# ============================================================================
# NETWORK SETTINGS (MODERATE)
# ============================================================================

# Allow non-isolated networks
network_isolation=false

# Use NAT for outbound connectivity
network_nat=true

# Enable VMM priority scheduling
vmm_strict_priority=true

# ============================================================================
# SNAPSHOT/SHARE SETTINGS (ENFORCED)
# ============================================================================

# Require MAC label for snapshots
snapshot_require_mac=true

# Require MAC label for shares
share_require_mac=true

# Enable share path validation
share_path_validation=true

# ============================================================================
# DEBUG SETTINGS (DISABLED)
# ============================================================================

# Disable module debug output
module_debug=false

# Minimal audit verbosity
module_audit_level=1

# Check for conflicting modules
conflict_check=true

# ============================================================================
# MEMORY SETTINGS (BALANCED)
# ============================================================================

# Enable memory balloon for dynamic adjustment
balloon_enabled=true

# Disable memory encryption (may impact performance)
memory_encryption=false

# Disable swap encryption (may impact performance)
swap_encryption=false

# Enable NUMA awareness
numa_aware=true

# Auto-select huge pages
huge_pages=auto

# ============================================================================
# DEFAULT INSTANCE SETTINGS
# ============================================================================

# Default directories
instance_dir=/var/emu
image_cache_dir=/var/cache/emu/images

# Default architecture and mode
default_arch=amd64
default_mode=auto
default_cpu_level=2

# Default resource allocation
default_memory=512M
default_cpus=2

# ============================================================================
# OUTPUT SETTINGS
# ============================================================================

output_format=text
verbose=no
