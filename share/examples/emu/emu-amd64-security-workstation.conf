# emu-amd64-security-workstation.conf - AMD64/x86-64 Security Workstation
# High-security configuration for sensitive workloads
#
# Suitable for:
# - Security research and penetration testing
# - Cryptographic operations
# - Financial transactions
# - Government/military applications
#
# Installation: Copy to /usr/local/etc/emu/emu.conf

# ============================================================================
# ARCHITECTURE SETTINGS - Security Focused
# ============================================================================

# Target architecture
arch=amd64

# CPU emulation level - maximum security features
cpu_level=6

# Enable all modern instruction sets
enable_sse42=true
enable_avx=true
enable_avx512=true

# Enable AES-NI for encryption acceleration
enable_aesni=true

# Disable speculative execution mitigations not needed (controlled env)
cpu_mitigations=off

# ============================================================================
# SECURITY SETTINGS - Maximum Enforcement
# ============================================================================

securelevel=3
mac_enforce=true
veriexec_check=strict
audit_enabled=true
audit_buffer_size=8192

# Enable all security features
secureboot_mode=audit
encrypted_memory=true
smap_enabled=true
smep_enabled=true

# ============================================================================
# RESOURCE LIMITS - Constrained
# ============================================================================

max_instances=4
max_memory_mb=16384
max_vcpus=8
memory_warn_percent=70
oom_protection=true
rctl_enabled=true

# Strict memory policies
huge_pages=never
numa_aware=false

# ============================================================================
# DEVICE CONFIGURATION - Minimal Attack Surface
# ============================================================================

devices=minimal

# Network - only if needed
network_device=virtio-net
network_queues=1
network_offload=disable

# Storage - encrypted
storage_device=virtio-blk
storage_encryption=aes-256-xts
storage_queues=1

# Disable balloon (memory transparency)
balloon_device=disable

# Disable unnecessary devices
rng_device=virtio-rng
fs_device=disable

# ============================================================================
# VIDEO CONFIGURATION - Headless by Default
# ============================================================================

# VNC only with strong authentication
video_device=none

# VNC for remote access (if needed)
vnc_enabled=true
vnc_port=5900
vnc_password=required
vnc_read_only=false

# ============================================================================
# OUTPUT SETTINGS - Minimal Logging
# ============================================================================

output_format=text
verbose=no
debug_mode=no

# ============================================================================
# PERFORMANCE TUNING - Security Over Performance
# ============================================================================

# CPU scheduling - security over performance
cpu_affinity=fixed
cpu_latency_target=normal

# Memory - no sharing
memory_hog_protection=true
ksm_enabled=false
thp_mode=never

# Network - paranoid settings
network_latency_target=high
network_checksums=always

# ============================================================================
# DEFAULT INSTANCE SETTINGS
# ============================================================================

default_memory=4G
default_cpus=2
default_arch=amd64
default_mode=secure

instance_dir=/var/emu
image_cache_dir=/var/cache/emu/images

# ============================================================================
# COMPATIBILITY NOTES
# ============================================================================

# This configuration is optimized for:
# - Maximum security enforcement
# - Minimal attack surface
# - Audit trail for all operations
# - Encrypted storage
#
# Requirements:
# - MAC framework enabled
# - Veriexec signatures for all binaries
# - Separate network for sensitive workloads
#
# Not suitable for:
# - Gaming or multimedia
# - Development (use desktop config)
# - Maximum performance (use server config)
