# emu-powerpc64.conf - PowerPC 64-bit Configuration
# Modern PowerPC for server/workstation emulation
#
# Emulates PowerPC G4 (74xx) or G5 (970) class processors.
# Suitable for running 64-bit PowerPC operating systems.
#
# Installation: Copy to /usr/local/etc/emu/emu.conf

# ============================================================================
# ARCHITECTURE SETTINGS
# ============================================================================

# Target architecture
arch=powerpc64

# CPU model - G5 (970) or G4 (7448)
cpu_model=970

# Enable 64-bit mode
enable_64bit=true

# Enable AltiVec SIMD (G4+)
enable_altivec=true

# Enable FPU
enable_fpu=true

# PowerPC 970 (G5) specific
cpu_features=g5

# ============================================================================
# HARDWARE COMPATIBILITY
# ============================================================================

# Video - ATI Radeon (Mac Edition)
video_model=radeon
video_memory=128M

# Sound - Apple Sound Chip
audio_model=asc

# Network - GEM (Gigabit Ethernet for G5)
network_model=gem

# USB - EHCI (USB 2.0)
usb_model=ehci

# FireWire - IEEE 1394
firewire_enabled=true

# AGP slot for graphics
agp_enabled=true

# ============================================================================
# MAC-SPECIFIC SETTINGS
# ============================================================================

# New World ROM support
rom_type=newworld

# Open Firmware with 64-bit support
open_firmware=true

# NVRAM (64-bit aware)
nvram_size=8K

# PRAM emulation
pram_enabled=true

# SMP support (G5 supports up to 2 cores)
max_cpu_cores=2

# ============================================================================
# BOOT DEVICE SETTINGS
# ============================================================================

# Primary boot device
boot_device=sata0

# CD-ROM
cdrom_model=sata

# Disable legacy floppy
floppy_enabled=false

# ============================================================================
# SECURITY SETTINGS
# ============================================================================

securelevel=1
mac_enforce=true
veriexec_check=auto
audit_enabled=true
audit_buffer_size=4096

# ============================================================================
# RESOURCE LIMITS
# ============================================================================

max_instances=8
max_memory_mb=8192
max_vcpus=2
memory_warn_percent=75
oom_protection=true
rctl_enabled=true

# ============================================================================
# DEVICE CONFIGURATION
# ============================================================================

devices=all

# Enable all VirtIO devices
network_device=virtio-net
storage_device=virtio-blk
rng_device=virtio-rng
balloon_device=virtio-balloon
fs_device=virtio-9p

# ============================================================================
# DEFAULT INSTANCE SETTINGS
# ============================================================================

default_memory=2G
default_cpus=1
default_arch=powerpc64
default_mode=auto

instance_dir=/var/emu
image_cache_dir=/var/cache/emu/images

# ============================================================================
# OUTPUT SETTINGS
# ============================================================================

output_format=text
verbose=no

# ============================================================================
# COMPATIBILITY NOTES
# ============================================================================

# Compatible with:
# - Mac OS X 10.4 - 10.5 (Darwin 8-9)
# - Linux for PowerPC64 (Debian, Fedora)
# - FreeBSD/powerpc64
#
# Not compatible with:
# - Classic Mac OS (requires 32-bit PowerPC)
# - Early Mac OS X 10.0 - 10.3 (32-bit)
