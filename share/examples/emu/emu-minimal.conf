# emu-minimal.conf - Minimal Configuration
# Lightweight emulation with essential features only
#
# Use case: Embedded systems, resource-constrained environments,
# testing, or quick prototyping.
#
# Installation: Copy to /usr/local/etc/emu/emu.conf

# ============================================================================
# ARCHITECTURE SETTINGS
# ============================================================================

arch=amd64
cpu_level=2

# Minimal CPU features
enable_sse2=true

# ============================================================================
# SECURITY SETTINGS
# ============================================================================

securelevel=0
mac_enforce=false
veriexec_check=false
audit_enabled=false

# ============================================================================
# RESOURCE LIMITS
# ============================================================================

max_instances=4
max_memory_mb=1024
max_vcpus=1
memory_warn_percent=90
oom_protection=false
rctl_enabled=false

# ============================================================================
# DEVICE CONFIGURATION
# ============================================================================

devices=minimal

# Minimal console
console_device=serial
serial_enabled=true

# Minimal storage (IDE for compatibility)
storage_device=ide

# Disable all other devices
network_device=disable
rng_device=disable
balloon_device=disable
fs_device=disable
audio_device=disable
usb_device=disable

# ============================================================================
# DEFAULT INSTANCE SETTINGS
# ============================================================================

default_memory=256M
default_cpus=1
default_arch=amd64
default_mode=minimal

instance_dir=/var/emu
image_cache_dir=/var/cache/emu/images

# ============================================================================
# OUTPUT SETTINGS
# ============================================================================

output_format=text
verbose=no

# ============================================================================
# USE CASES
# ============================================================================

# This configuration is ideal for:
# - Embedded applications
# - IoT gateways
# - Simple test environments
# - Learning/emulation testing
# - CI/CD pipelines
# - Container base images
# - Minimal reproducible test cases
