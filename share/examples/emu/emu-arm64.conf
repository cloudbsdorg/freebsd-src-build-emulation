# emu-arm64.conf - ARM64/AArch64 Configuration
# 64-bit ARM architecture for modern ARM systems
#
# Suitable for running ARM64 guest operating systems on ARM64 hosts
# or x86_64 hosts with ARM64 emulation support.
#
# Installation: Copy to /usr/local/etc/emu/emu.conf

# ============================================================================
# ARCHITECTURE SETTINGS
# ============================================================================

# Target architecture
arch=arm64

# CPU model (Cortex-A72 compatible default)
cpu_model=cortex-a72

# Enable ARMv8.1 features
enable_armv81=true

# Enable NEON SIMD
enable_neon=true

# Enable Cryptography Extensions
enable_crypto=true

# Enable Floating Point Unit
enable_fpu=true

# ============================================================================
# SECURITY SETTINGS
# ============================================================================

securelevel=1
mac_enforce=true
veriexec_check=auto
audit_enabled=true
audit_buffer_size=4096

# ============================================================================
# RESOURCE LIMITS
# ============================================================================

max_instances=24
max_memory_mb=32768
max_vcpus=32
memory_warn_percent=80
oom_protection=true
rctl_enabled=true

# ============================================================================
# DEVICE CONFIGURATION
# ============================================================================

# Enable all standard devices
devices=all

# Network device
network_device=virtio-net

# Storage device
storage_device=virtio-blk

# RNG device
rng_device=virtio-rng

# Balloon device
balloon_device=virtio-balloon

# 9P filesystem device
fs_device=virtio-9p

# ============================================================================
# DEFAULT INSTANCE SETTINGS
# ============================================================================

default_memory=2G
default_cpus=4
default_arch=arm64
default_mode=auto

instance_dir=/var/emu
image_cache_dir=/var/cache/emu/images

# ============================================================================
# OUTPUT SETTINGS
# ============================================================================

output_format=text
verbose=no
