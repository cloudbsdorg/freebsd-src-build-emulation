# emu-i386.conf - i386/IA-32 Configuration
# Legacy 32-bit x86 configuration for older systems
#
# Suitable for running 32-bit guest operating systems or
# emulating older hardware configurations.
#
# Installation: Copy to /usr/local/etc/emu/emu.conf

# ============================================================================
# ARCHITECTURE SETTINGS
# ============================================================================

# Target architecture
arch=i386

# CPU emulation level (Pentium 4 compatible)
cpu_level=2

# Enable SSE2 support
enable_sse2=true

# Enable PAE for >4GB memory access
enable_pae=true

# Disable modern extensions not available on i386
enable_avx=false
enable_aesni=false

# ============================================================================
# SECURITY SETTINGS
# ============================================================================

securelevel=1
mac_enforce=true
veriexec_check=auto
audit_enabled=true
audit_buffer_size=2048

# ============================================================================
# RESOURCE LIMITS
# ============================================================================

max_instances=16
max_memory_mb=4096
max_vcpus=4
memory_warn_percent=75
oom_protection=true
rctl_enabled=true

# ============================================================================
# DEVICE CONFIGURATION
# ============================================================================

# Enable standard devices (legacy options for i386)
devices=all

# Use e1000 network for compatibility
network_device=e1000

# Use ide for storage compatibility
storage_device=ide

# Enable basic devices
rng_device=vtpool
balloon_device=disable
fs_device=disable

# ============================================================================
# DEFAULT INSTANCE SETTINGS
# ============================================================================

default_memory=512M
default_cpus=1
default_arch=i386
default_mode=compat

instance_dir=/var/emu
image_cache_dir=/var/cache/emu/images

# ============================================================================
# OUTPUT SETTINGS
# ============================================================================

output_format=text
verbose=no
