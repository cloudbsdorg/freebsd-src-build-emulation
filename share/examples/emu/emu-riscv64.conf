# emu-riscv64.conf - RISC-V 64-bit Configuration
# RISC-V architecture for open-source hardware emulation
#
# Suitable for running RISC-V guest operating systems on any host.
# Based on RISC-V ISA specification with standard extensions.
#
# Installation: Copy to /usr/local/etc/emu/emu.conf

# ============================================================================
# ARCHITECTURE SETTINGS
# ============================================================================

# Target architecture
arch=riscv64

# Base ISA version
isa_version=2.2

# Enable standard extensions
# M: Integer Multiplication/Division
enable_rvm=true

# A: Atomic Instructions
enable_rva=true

# F: Single-Precision Floating Point
enable_rvf=true

# D: Double-Precision Floating Point
enable_rvd=true

# C: Compressed Instructions
enable_rvc=true

# U: User-mode privileged instructions
enable_rvu=true

# S: Supervisor mode (for OS guests)
enable_rvs=true

# H: Hypervisor extension
enable_rvh=true

# ============================================================================
# CPU CONFIGURATION
# ============================================================================

# CPU model
cpu_model=generic

# Hart (CPU core) configuration
hart_count=4

# Physical Memory Protection (PMP) regions
pmp_regions=16

# ============================================================================
# SECURITY SETTINGS
# ============================================================================

securelevel=1
mac_enforce=true
veriexec_check=auto
audit_enabled=true
audit_buffer_size=4096

# ============================================================================
# RESOURCE LIMITS
# ============================================================================

max_instances=32
max_memory_mb=32768
max_vcpus=32
memory_warn_percent=80
oom_protection=true
rctl_enabled=true

# ============================================================================
# DEVICE CONFIGURATION
# ============================================================================

devices=all

# Network device
network_device=virtio-net

# Storage device
storage_device=virtio-blk

# RNG device
rng_device=virtio-rng

# Balloon device
balloon_device=virtio-balloon

# 9P filesystem device
fs_device=virtio-9p

# CLINT (Core Local Interruptor) for timer/IPI
clint_enabled=true

# PLIC (Platform Level Interrupt Controller)
plic_enabled=true

# UART for console
uart_enabled=true

# ============================================================================
# DEFAULT INSTANCE SETTINGS
# ============================================================================

default_memory=4G
default_cpus=4
default_arch=riscv64
default_mode=auto

instance_dir=/var/emu
image_cache_dir=/var/cache/emu/images

# ============================================================================
# OUTPUT SETTINGS
# ============================================================================

output_format=text
verbose=no
